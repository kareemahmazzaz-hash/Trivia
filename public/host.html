<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Night - Host</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js?v=202608130929"></script>
<script>
  // Load the right transport script(s) before anything else runs.
  (TRANSPORT === "firebase"
    ? ["https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js",
       "https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js",
       "js/firebase-config.js?v=202608130929"]
    : ["/socket.io/socket.io.js"]
  ).forEach((src) => document.write(`<script src="${src}"><\/script>`));
</script>
</head>
<body>
  <div class="screen">
    <div class="host-header">
      <h1>🎙️ Host Controller</h1>
      <button id="resetAllBtn" class="danger">🔄 Reset Game</button>
    </div>
    <div id="app" class="card"></div>
  </div>

  <script src="js/utils.js?v=202608130929"></script>
  <script src="js/questions.js?v=202608130929"></script>
  <script src="js/gameClient.js?v=202608130929"></script>
  <script src="js/host.js?v=202608130929"></script>
</body>
</html>
