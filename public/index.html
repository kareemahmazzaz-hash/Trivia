<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Night</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <h1>🎉 Trivia Night</h1>
    <div class="card" style="max-width:440px; text-align:center;">
      <p>Open <strong>tv.html</strong> on the laptop connected to the screen.<br>
      Open <strong>host.html</strong> on your own phone to run the game.<br>
      Players join via <strong>player.html</strong> - scan the QR code shown on
      the TV once teams are assigned.</p>
      <p style="color:var(--muted); font-size:0.95rem;">Mode is set in <code>js/config.js</code> (LAN or online) - see README.md.</p>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:16px;">
        <a href="tv.html"><button style="width:100%">Open TV Display</button></a>
        <a href="host.html"><button class="secondary" style="width:100%">Open Host Controller</button></a>
        <a href="player.html"><button class="secondary" style="width:100%">Open Player View</button></a>
      </div>
    </div>
  </div>
</body>
</html>
